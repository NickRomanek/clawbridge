name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: |
      (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA document and I hereby sign the CLA.')
      || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/${{ github.repository }}/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'bot*,dependabot*'
          create-file-commit-message: 'chore: create CLA signature file'
          signed-commit-message: 'chore: record CLA signature for $contributorName'
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, you need to sign our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md).

            To sign, please comment on this PR with:

            > I have read the CLA document and I hereby sign the CLA.

            This only needs to be done once. After signing, the CLA check will pass automatically on all future PRs.
          custom-pr-sign-comment: 'I have read the CLA document and I hereby sign the CLA.'
          lock-pullrequest-aftermerge: false
